[project]
name = "graph-memory-usecase"
version = "0.1.0"
description = "Real-application proof for graph-memory-platform: signals in, personalized context out, outcomes correlated, the loop closed with visible lift."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
demo = "tutor_demo.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor_demo"]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: requires the deployed platform (ClickHouse + checkout); skips with a hint when missing",
]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "T20", "PL", "RUF"]
per-file-ignores = { "tests/*" = ["PLR2004"], "src/tutor_demo/demo.py" = ["T201"] }
# 6: envelope(event_id, type, user, data, at_ms, source) and the demo's phase calls
[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 6
